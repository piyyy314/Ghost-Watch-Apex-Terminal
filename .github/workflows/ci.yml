name: Ghost-Watch Apex CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Typecheck and Compile
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found - executing npm ci"
            npm ci
          else
            echo "No package-lock.json found - generating and executing npm install"
            npm install
          fi

      - name: Run TypeScript Type Check & Linter
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Forensic Artifacts & Build Assets
        run: |
          test -d dist
          test -f dist/index.html
          echo "Ghost-Watch Apex build verified successfully."
